stages:
  - shadow-file-generation

generate-shadow-file:
  stage: shadow-file-generation
  image: python:3.11-slim
  resource_group: shadow-file-generation-lock
  
  before_script:
    # 1. Install git and pip/dependencies
    # Note: Using python:3.11-slim means git is not installed by default.
    # We install it here because this is a PoC environment. 
    # In a production environment, it is recommended to use a custom Docker image 
    # that already has git and necessary python packages installed to speed up the pipeline.
    - apt-get update && apt-get install -y git
    - pip install "markitdown[xlsx]" xlrd msoffcrypto-tool

    # === Commit Info Logging ===
    - echo "=================================================="
    - echo "Pipeline Commit Info"
    - echo "=================================================="
    - echo "Current Commit SHA    : ${CI_COMMIT_SHA}"
    - echo "Current Commit Author : ${CI_COMMIT_AUTHOR}"
    - echo "Current Commit Message: ${CI_COMMIT_MESSAGE}"
    - echo "--------------------------------------------------"
    - |
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        echo "Previous Commit SHA   : ${CI_COMMIT_BEFORE_SHA}"
        git show -s --format="Previous Commit Author: %an%nPrevious Commit Message: %s" ${CI_COMMIT_BEFORE_SHA} || echo "Previous commit details not available (shallow clone?)"
      else
        echo "Previous Commit SHA   : (Initial commit or not set)"
      fi
    - echo "=================================================="

  script:
    # 2. Run the shadow generation script
    # The script is located in .gitlab-scripts/ to keep it separate from main project code
    - python .gitlab-scripts/generate_shadow.py

    # 3. Check for changes and push
    # Configure git user for the commit
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
    
    # Add all changes (shadow files are generated in place)
    - git add .
    
    # Check if there are changes to commit
    - |
      if git diff --cached --quiet; then
        echo "No changes in shadow files detected."
      else
        echo "Changes detected. Committing and pushing..."
        # Create a safe commit message file to handle special characters
        printf "Update shadow files [skip ci]\n\nSource Commit: %s\n%s" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_TITLE}" > commit_message.txt
        git commit -F commit_message.txt
        
        # Push to the repository using CI_JOB_TOKEN
        # We use 'gitlab-server' hostname as defined in docker-compose.yml 
        # so the runner can resolve the address within the docker network.
        # Note: Project Access Token or proper Job Token permissions are required.
        git push http://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab-server/${CI_PROJECT_PATH}.git HEAD:${CI_COMMIT_REF_NAME}
      fi
